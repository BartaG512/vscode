name: Manual Build

on:
  workflow_dispatch

jobs:
  build:
    name: Build VSCode Win32 x64
    runs-on: windows-2022  # Windows Server 2022 runner
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository into subdirectory
        uses: actions/checkout@v4
        with:
          path: repo  # Corrected placement of the 'path' key

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: repo/.nvmrc  # Specify the correct path to .nvmrc

      - name: Install dependencies
        run: npm ci
        working-directory: repo

      - name: Build VSCode Win32 x64
        run: npx gulp vscode-win32-x64
        working-directory: repo

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-win32-x64
          path: repo/VSCode-win32-x64  # Ensure the correct relative path to the output directory
          retention-days: 7
